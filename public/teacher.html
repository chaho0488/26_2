<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사용 - 매체 비평 수행평가</title>
<style>
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; margin: 0; background: #f3f5f9; color: #111; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px; }
  .card { background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  input, button, select { font: inherit; padding: 8px 10px; border-radius: 4px; border: 1px solid #bbb; box-sizing: border-box; }
  button { background: #1f3864; color: #fff; border: 0; cursor: pointer; white-space: nowrap; }
  button.s { background: #666; padding: 4px 8px; font-size: 13px; }
  /* 조작 줄: 비밀번호 한 줄, 그 아래 반 선택 + 버튼들이 줄바꿈되며 정렬 */
  #ctl b { display: block; margin-bottom: 8px; }
  #ctl .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  #ctl input { width: 100%; }
  #ctl select { flex: 1 1 160px; min-width: 0; }
  #msg { display: block; margin-top: 6px; }
  /* 표: 좁은 화면에서는 옆으로 밀어 본다 */
  .wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 760px; }
  td, th { border: 1px solid #ccc; padding: 5px 7px; text-align: left; vertical-align: middle; white-space: nowrap; }
  th { background: #e7eef7; }
  td.t { white-space: normal; min-width: 220px; }
  td.act { white-space: normal; min-width: 180px; } td.act button { margin: 2px 2px 2px 0; }
  td.t select { max-width: 260px; }
  .warn { color: #c00000; font-weight: bold; }
  .hide { display: none; }
  .ans h3 { color: #1f3864; margin: 14px 0 4px; }
  .ans p { white-space: pre-wrap; background: #f8f8f8; padding: 8px; border-radius: 4px; margin: 2px 0 8px; }
  @media print { button, #ctl, #over { display: none; } }
</style>
</head>
<body><main>
  <div class="card" id="ctl">
    <b>교사용 화면</b>
    <input id="pw" type="password" placeholder="교사 비밀번호">
    <div class="row">
      <select id="cls"></select>
      <button onclick="overview()">현황 보기</button>
    </div>
    <div class="row">
      <button onclick="extend()">반 전체 시간 연장</button>
      <button onclick="csv()">CSV 내려받기</button>
    </div>
    <span id="msg" class="warn"></span>
  </div>
  <div class="card" id="over"></div>
  <div class="card ans hide" id="detail"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const api = async (p, body) => {
  const r = await fetch("/api/t/" + p, { method: body ? "POST" : "GET", headers: { "x-teacher-pw": $("#pw").value, "content-type": "application/json" }, body: body && JSON.stringify(body) });
  if (p.endsWith(".csv")) return r;
  const d = await r.json(); if (!r.ok) throw new Error(d.error); return d;
};
const run = f => f().catch(e => $("#msg").textContent = e.message);
let A = {};
// 반 목록 불러오기. 비밀번호가 틀리면 오류, 학생이 없으면 안내
async function loadClasses() {
  const c = await api("classes");
  $("#cls").innerHTML = c.map(x => `<option value="${x.class}">${x.class[0]}학년 ${x.class[1]}반 (${x.n}명)</option>`).join("");
  if (!c.length) { $("#over").innerHTML = "<p>비밀번호는 맞습니다. 아직 등록된 학생이 없습니다.</p>"; return false; }
  return true;
}
$("#pw").onchange = () => run(async () => { if (await loadClasses()) overview(); });
function overview() { run(async () => {
  $("#msg").textContent = "";
  if (!$("#cls").value && !(await loadClasses())) return;   // 휴대폰처럼 change 신호가 안 온 경우 여기서 불러온다
  const d = await api("overview?class=" + $("#cls").value);
  A = Object.fromEntries(d.articles.map(a => [a.no, a.title]));
  const fmt = t => t ? new Date(t).toLocaleTimeString("ko-KR", { hour12: false }) : "-";
  const taken = new Set(d.students.map(s => s.article).filter(Boolean));
  const free = d.articles.filter(a => !taken.has(a.no));
  $("#over").innerHTML = `<p>선택된 기사 ${taken.size}/${d.articles.length} · 남은 기사: ${free.map(a => a.no).join(", ") || "없음"}</p>
  <div class="wrap"><table><tr><th>학번</th><th>이름</th><th>기사</th><th>시작</th><th>마감</th><th>마지막 저장</th><th>덩어리 입력 거부</th><th></th></tr>` +
  d.students.map(s => `<tr><td>${s.id}</td><td>${s.name}</td>
    <td class="t">${s.article ? s.article + ". " + A[s.article] : `<select id="as${s.id}">${free.map(a => `<option value="${a.no}">${a.no}. ${a.title}</option>`).join("")}</select> <button class="s" onclick="assign('${s.id}')">배정</button>`}</td>
    <td>${fmt(s.started_at)}</td><td>${s.deadline && s.deadline < d.now ? "<span class=warn>" + fmt(s.deadline) + "</span>" : fmt(s.deadline)}</td><td>${fmt(s.updated_at)}</td>
    <td class="${s.paste_count ? "warn" : ""}">${s.paste_count}</td>
    <td class="act"><button class="s" onclick="view('${s.id}')">답안</button> <button class="s" onclick="extend('${s.id}')">연장</button> <button class="s" onclick="resetpw('${s.id}','${s.name}')">비번 초기화</button>${s.article ? ` <button class="s" onclick="unassign('${s.id}')">선택 해제</button>` : ""}</td></tr>`).join("") + "</table></div>";
}); }
function view(id) { run(async () => {
  const d = await api("student?id=" + id);
  $("#detail").classList.remove("hide");
  $("#detail").innerHTML = `<h2>${d.id} ${d.name} — ${d.article ? `[기사 ${d.article}] ${d.title}` : "(기사 미선택)"}</h2><p>덩어리 입력 거부 ${d.paste_count}회</p>` +
    d.sections.map(s => `<h3>${s.no} ${s.name}</h3>` + s.fields.map(([k, label]) => `<b>${label}</b><p>${(d.answers[k] || "(미작성)").replace(/</g, "&lt;")}</p>`).join("")).join("") +
    `<button onclick="window.print()">인쇄</button>`;
  $("#detail").scrollIntoView();
}); }
function extend(id) { const m = prompt(id ? "이 학생에게 몇 분 연장할까요?" : "이 반 전체(시작한 학생만)에 몇 분 연장할까요?", "5"); if (m) run(async () => { await api("extend", { id, class: $("#cls").value, minutes: Number(m) }); overview(); }); }
function resetpw(id, name) { if (confirm(`${id} ${name}의 비밀번호를 초기화할까요?\n학생이 다음에 들어올 때 입력하는 비밀번호가 새 비밀번호가 됩니다.`)) run(async () => { await api("reset-pw", { id }); alert("초기화했습니다."); }); }
function assign(id) { run(async () => { await api("assign", { id, no: Number($("#as" + id).value) }); overview(); }); }
function unassign(id) { if (confirm("기사 선택을 해제할까요? 학생이 다시 고를 수 있게 됩니다.")) run(async () => { await api("assign", { id, no: null }); overview(); }); }
function csv() { run(async () => { const r = await api("export.csv?class=" + $("#cls").value); const b = await r.blob(); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `answers_${$("#cls").value}.csv`; a.click(); }); }
</script>
</body>
</html>
